name: Publicar site BrasilCord

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter arquivos públicos
        uses: actions/checkout@v4

      - name: Verificar site estático
        shell: bash
        run: |
          test -s docs/index.html
          test -s docs/styles.css
          test -s docs/site.js
          test -s docs/favicon.svg
          test -s docs/mobile/index.html
          test -s docs/mobile/styles.css
          test -s docs/mobile/app.js
          test -s docs/mobile/sw.js
          test -s docs/mobile/manifest.webmanifest
          test -s docs/mobile/icon-192.png
          test -s docs/mobile/icon-512.png
          node --check docs/mobile/app.js
          node --check docs/mobile/voice.js
          grep -q 'function renegotiateAll' docs/mobile/voice.js
          grep -q "addEventListener('unmute'" docs/mobile/voice.js
          grep -q 'mobile-call-avatar' docs/mobile/advanced.css
          node --check docs/mobile/tools.js
          test -s docs/mobile/advanced.css
          grep -q 'brasilcord-web/' docs/mobile/index.html
          grep -q "location.replace(target.href)" docs/mobile/index.html
          node --check docs/mobile/sw.js
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('docs/mobile/manifest.webmanifest','utf8'));if(m.display!=='standalone'||!m.start_url)process.exit(1)"
          node --check docs/site.js
          ! grep -Eq 'password|DATABASE_URL|RESEND_API_KEY|EMAIL_OTP_SECRET|BRASILCORD_OWNER_USER_ID' docs/index.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empacotar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
