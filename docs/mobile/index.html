<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a1826">
  <meta name="robots" content="noindex,follow">
  <title>BrasilCord Mobile — mesmo aplicativo do PC</title>
  <meta name="description" content="BrasilCord Mobile agora utiliza a mesma interface do BrasilCord Web, adaptada para seu celular.">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#071821;color:#f2f8f7}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 60% 10%,#174b4b 0%,transparent 50%),#071821}
    main{text-align:center;width:min(430px,100%);padding:29px 23px;border:1px solid #ffffff2c;border-radius:24px;background:#112231;box-shadow:0 25px 80px #0005}
    img{width:92px;height:92px;object-fit:contain}h1{font-size:27px;margin:14px 0 10px}p{color:#b9d3d5;line-height:1.6}
    a{display:block;border-radius:12px;padding:15px 18px;margin:14px 0;color:#12252c;background:#f6d85b;font-weight:800;text-decoration:none}
    small{color:#9db3bc}
  </style>
  <script>
    (() => {
      const params=new URLSearchParams(location.search);
      const target=new URL('https://cdopc7870-web.github.io/brasilcord-web/');
      target.searchParams.set('app','1');
      if(params.get('cadastro')==='1')target.searchParams.set('cadastro','1');
      if(params.get('install')==='1')target.searchParams.set('install','1');
      // Login e comunidades agora usam a mesma interface Web/PC.
      location.replace(target.href);
    })();
  </script>
</head>
<body>
  <main>
    <img src="./icon-192.png" alt="BrasilCord">
    <h1>BrasilCord Mobile 🇧🇷</h1>
    <p>Agora o celular utiliza a mesma versão do BrasilCord para PC, com menus e botões adaptados à tela.</p>
    <a href="https://cdopc7870-web.github.io/brasilcord-web/?app=1">Abrir BrasilCord Mobile</a>
    <small>Se a abertura automática não funcionar, toque no botão acima.</small>
  </main>
</body>
</html>
